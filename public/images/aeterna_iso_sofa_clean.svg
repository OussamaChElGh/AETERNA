<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="sofa-leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="50%" stop-color="#6A3805" />
      <stop offset="100%" stop-color="#4A2502" />
    </linearGradient>
    <linearGradient id="sofa-cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0522D" />
      <stop offset="100%" stop-color="#703611" />
    </linearGradient>
  </defs>

  <!-- Isometric Base Contact Shadow -->
  <ellipse cx="80" cy="85" rx="55" ry="25" fill="#000000" opacity="0.4" />

  <!-- Main Isometric Sofa Body -->
  <g filter="url(#drop-shadow)">
    <!-- Back Rest (Isometric Angle) -->
    <path d="M 35 45 L 80 22 L 125 45 L 125 65 L 80 42 L 35 65 Z" fill="url(#sofa-leather)" stroke="#2C1402" stroke-width="2" />
    
    <!-- Arm Rest Left -->
    <path d="M 25 55 L 45 45 L 60 52 L 40 62 L 25 55 Z" fill="#9C5221" stroke="#2C1402" stroke-width="2" />
    <path d="M 25 55 L 40 62 L 40 78 L 25 71 Z" fill="#6A3805" stroke="#2C1402" stroke-width="2" />

    <!-- Arm Rest Right -->
    <path d="M 100 52 L 115 45 L 135 55 L 120 62 Z" fill="#9C5221" stroke="#2C1402" stroke-width="2" />
    <path d="M 120 62 L 135 55 L 135 71 L 120 78 Z" fill="#4A2502" stroke="#2C1402" stroke-width="2" />

    <!-- Seat Cushions (Isometric Planes) -->
    <path d="M 40 62 L 80 42 L 120 62 L 80 82 Z" fill="url(#sofa-cushion)" stroke="#2C1402" stroke-width="2" />
    <path d="M 40 62 L 80 82 L 80 92 L 40 72 Z" fill="#6A3805" stroke="#2C1402" stroke-width="2" />
    <path d="M 80 82 L 120 62 L 120 72 L 80 92 Z" fill="#4A2502" stroke="#2C1402" stroke-width="2" />

    <!-- Cushion Stitch Line Split -->
    <path d="M 80 42 L 80 82" stroke="#2C1402" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Wooden Legs -->
    <path d="M 30 71 L 30 84 L 34 84 L 34 73 Z" fill="#1C0A00" />
    <path d="M 126 71 L 126 84 L 130 84 L 130 73 Z" fill="#1C0A00" />
    <path d="M 78 92 L 78 98 L 82 98 L 82 92 Z" fill="#1C0A00" />
  </g>
</svg>
