<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <defs>
    <radialGradient id="shelf-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mahogany-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#270F02" />
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="70" cy="165" rx="55" ry="18" fill="url(#shelf-shadow)" />

  <g transform="translate(0, 5)">
    <!-- Main Mahogany Bookshelf Case (Isometric Perspective) -->
    <!-- Top Crown Plane -->
    <polygon points="25,20 70,5 115,20 70,35" fill="#9A3412" stroke="#270F02" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Left Outer Wall -->
    <polygon points="25,20 70,35 70,155 25,140" fill="#7C2D12" stroke="#270F02" stroke-width="2.5" fill-opacity="0.95" />

    <!-- Right Outer Wall -->
    <polygon points="70,35 115,20 115,140 70,155" fill="#451A03" stroke="#270F02" stroke-width="2.5" fill-opacity="0.95" />

    <!-- Shelves & Book Rows -->
    <!-- Shelf 1 Books -->
    <rect x="35" y="45" width="8" height="25" fill="#DC2626" rx="1" />
    <rect x="44" y="43" width="10" height="27" fill="#2563EB" rx="1" />
    <rect x="55" y="47" width="8" height="23" fill="#D97706" rx="1" />
    <rect x="64" y="44" width="12" height="26" fill="#059669" rx="1" />
    <rect x="77" y="42" width="10" height="28" fill="#7C3AED" rx="1" />
    <rect x="88" y="45" width="8" height="25" fill="#B91C1C" rx="1" stroke="#FDE047" stroke-width="1" />

    <!-- Middle Divider Shelf -->
    <polygon points="25,75 70,90 115,75 70,60" fill="#7C2D12" stroke="#270F02" stroke-width="2" />

    <!-- Shelf 2 Books & Parchment Scrolls -->
    <rect x="38" y="100" width="12" height="30" fill="#0284C7" rx="1" />
    <rect x="51" y="102" width="9" height="28" fill="#E11D48" rx="1" />
    <rect x="61" y="98" width="14" height="32" fill="#CA8A04" rx="1" stroke="#FDE047" stroke-width="1.5" />
    <circle cx="85" cy="115" r="8" fill="#FEF08A" stroke="#78350F" stroke-width="2" />
    <rect x="95" y="105" width="10" height="25" fill="#059669" rx="1" />

    <!-- Bottom Base Rim -->
    <polygon points="25,140 70,155 115,140 70,125" fill="#451A03" stroke="#270F02" stroke-width="2" />
  </g>
</svg>
