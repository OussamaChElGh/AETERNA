<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <radialGradient id="rug-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rug-teal-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="gold-trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Ground Soft Contact Shadow -->
  <polygon points="100,12 195,59 100,106 5,59" fill="url(#rug-shadow)" />

  <!-- Main Flat Isometric Rug Diamond -->
  <g>
    <!-- Base Rug Fabric -->
    <polygon points="100,10 190,55 100,100 10,55" fill="url(#rug-teal-body)" stroke="url(#gold-trim)" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Ornate Golden Outer Band -->
    <polygon points="100,18 178,55 100,92 22,55" fill="none" stroke="url(#gold-trim)" stroke-width="2" stroke-dasharray="8 4" />
    
    <!-- Inner Diamond Emblem -->
    <polygon points="100,32 135,55 100,78 65,55" fill="#047857" stroke="url(#gold-trim)" stroke-width="2" />
    <circle cx="100" cy="55" r="9" fill="#FDE047" stroke="#854D0E" stroke-width="1.5" />

    <!-- Fringes along isometric sides -->
    <path d="M 10 55 L 3 59 M 20 60 L 13 64 M 30 65 L 23 69 M 40 70 L 33 74 M 50 75 L 43 79 M 60 80 L 53 84 M 70 85 L 63 89 M 80 90 L 73 94 M 90 95 L 83 99" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 190 55 L 197 59 M 180 60 L 187 64 M 170 65 L 177 69 M 160 70 L 167 74 M 150 75 L 157 79 M 140 80 L 147 84 M 130 85 L 137 89 M 120 90 L 127 94 M 110 95 L 117 99" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
