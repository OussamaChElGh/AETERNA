<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="rug-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <polygon points="100,12 192,58 100,104 8,58" fill="#000000" opacity="0.3" transform="translate(0, 4)" />

  <!-- Main Isometric Flat Rug Diamond Floor Tile -->
  <g>
    <!-- Base Rug Fabric Plane -->
    <polygon points="100,10 190,55 100,100 10,55" fill="url(#rug-teal)" stroke="url(#gold-border)" stroke-width="3" />
    
    <!-- Ornate Inner Golden Border Diamond -->
    <polygon points="100,20 175,55 100,90 25,55" fill="none" stroke="url(#gold-border)" stroke-width="2" stroke-dasharray="6 3" />
    
    <!-- Center Emblem -->
    <polygon points="100,35 130,55 100,75 70,55" fill="#0D9488" stroke="url(#gold-border)" stroke-width="1.5" />
    <circle cx="100" cy="55" r="8" fill="#FDE047" />

    <!-- Fringe Edges (Fleshy Fringes along isometric sides) -->
    <path d="M 10 55 L 4 58 M 20 60 L 14 63 M 30 65 L 24 68 M 40 70 L 34 73 M 50 75 L 44 78 M 60 80 L 54 83 M 70 85 L 64 88 M 80 90 L 74 93 M 90 95 L 84 98" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
    <path d="M 190 55 L 196 58 M 180 60 L 186 63 M 170 65 L 176 68 M 160 70 L 166 73 M 150 75 L 156 78 M 140 80 L 146 83 M 130 85 L 136 88 M 120 90 L 126 93 M 110 95 L 116 98" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
