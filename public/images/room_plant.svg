<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <defs>
    <radialGradient id="plant-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
  </defs>

  <!-- Floor Soft Contact Shadow -->
  <ellipse cx="50" cy="120" rx="30" ry="12" fill="url(#plant-shadow)" />

  <g transform="translate(0, 5)">
    <!-- Terracotta Pot Base -->
    <polygon points="32,95 68,95 62,120 38,120" fill="url(#pot-grad)" stroke="#451A03" stroke-width="2" stroke-linejoin="round" />
    <ellipse cx="50" cy="95" rx="18" ry="6" fill="#EA580C" stroke="#451A03" stroke-width="2" />
    <ellipse cx="50" cy="95" rx="15" ry="4.5" fill="#451A03" />

    <!-- Lush Stems and Monstera Leaves -->
    <path d="M 50 95 C 45 70 30 55 20 40" stroke="#15803D" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 50 95 C 55 70 70 50 80 35" stroke="#15803D" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 50 95 C 50 65 50 45 50 25" stroke="#166534" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Leaf 1 (Left Monstera Leaf) -->
    <path d="M 20 40 C 5 35 0 15 20 15 C 35 15 30 35 20 40 Z" fill="url(#leaf-grad)" stroke="#064E3B" stroke-width="2" />
    <line x1="20" y1="40" x2="15" y2="20" stroke="#86EFAC" stroke-width="1.5" />

    <!-- Leaf 2 (Right Monstera Leaf) -->
    <path d="M 80 35 C 95 30 100 10 80 10 C 65 10 70 30 80 35 Z" fill="url(#leaf-grad)" stroke="#064E3B" stroke-width="2" />
    <line x1="80" y1="35" x2="82" y2="15" stroke="#86EFAC" stroke-width="1.5" />

    <!-- Leaf 3 (Top Central Monstera Leaf) -->
    <path d="M 50 25 C 35 15 40 -5 50 -5 C 60 -5 65 15 50 25 Z" fill="url(#leaf-grad)" stroke="#064E3B" stroke-width="2" />
    <line x1="50" y1="25" x2="50" y2="0" stroke="#86EFAC" stroke-width="1.5" />
  </g>
</svg>
