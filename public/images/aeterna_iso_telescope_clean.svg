<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <filter id="brass-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#7B5B28" />
    </linearGradient>
    <linearGradient id="wood-tripod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#3D1E0B" />
    </linearGradient>
  </defs>

  <!-- Floor Contact Shadow -->
  <ellipse cx="60" cy="135" rx="35" ry="14" fill="#000000" opacity="0.4" />

  <g filter="url(#brass-glow)">
    <!-- Tripod Legs (Isometric Base) -->
    <line x1="60" y1="85" x2="25" y2="135" stroke="url(#wood-tripod)" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="85" x2="95" y2="135" stroke="url(#wood-tripod)" stroke-width="4" stroke-linecap="round" />
    <line x1="60" y1="85" x2="60" y2="140" stroke="#3D1E0B" stroke-width="4" stroke-linecap="round" />

    <!-- Tripod Center Brass Joint -->
    <circle cx="60" cy="85" r="7" fill="url(#brass-grad)" stroke="#4A3414" stroke-width="1.5" />

    <!-- Main Brass Telescope Cylinder (Angled Isometric View 45deg) -->
    <g transform="rotate(-30 60 70)">
      <!-- Objective Lens Ring -->
      <ellipse cx="25" cy="70" rx="4" ry="12" fill="#87CEEB" stroke="url(#brass-grad)" stroke-width="2" />
      
      <!-- Telescope Tube Body -->
      <polygon points="25,58 95,64 95,76 25,82" fill="url(#brass-grad)" stroke="#4A3414" stroke-width="1.5" />
      
      <!-- Eyepiece End -->
      <rect x="95" y="66" width="15" height="8" rx="2" fill="#B8860B" stroke="#4A3414" stroke-width="1" />
      <circle cx="112" cy="70" r="4" fill="#1A1A1A" />
      
      <!-- Metallic Brass Bands -->
      <line x1="45" y1="60" x2="45" y2="80" stroke="#FFE4B5" stroke-width="2" />
      <line x1="75" y1="62" x2="75" y2="78" stroke="#FFE4B5" stroke-width="2" />
    </g>
  </g>
</svg>
