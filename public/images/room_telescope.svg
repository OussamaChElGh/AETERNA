<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <defs>
    <radialGradient id="tripod-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="40%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#6B4E1B" />
    </linearGradient>
    <linearGradient id="tripod-leg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" />
      <stop offset="100%" stop-color="#3A1A05" />
    </linearGradient>
  </defs>

  <!-- Floor Soft Contact Shadow -->
  <ellipse cx="60" cy="138" rx="38" ry="14" fill="url(#tripod-shadow)" />

  <g transform="translate(0, 5)">
    <!-- Tripod Legs -->
    <line x1="60" y1="80" x2="22" y2="133" stroke="url(#tripod-leg)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="60" y1="80" x2="98" y2="133" stroke="url(#tripod-leg)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="60" y1="80" x2="60" y2="138" stroke="#3A1A05" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tripod Brass Joint Mount -->
    <circle cx="60" cy="80" r="7.5" fill="url(#brass-body)" stroke="#3A2307" stroke-width="2" />

    <!-- Main Angled Brass Telescope Barrel -->
    <g transform="rotate(-28 60 65)">
      <!-- Front Lens Objective Glass -->
      <ellipse cx="22" cy="65" rx="4" ry="13" fill="#60A5FA" stroke="url(#brass-body)" stroke-width="2.5" />
      
      <!-- Telescope Cylinder Barrel -->
      <polygon points="22,52 98,58 98,72 22,78" fill="url(#brass-body)" stroke="#3A2307" stroke-width="2" />
      
      <!-- Eyepiece Tube -->
      <rect x="98" y="60" width="16" height="10" rx="2" fill="#B8860B" stroke="#3A2307" stroke-width="1.5" />
      <circle cx="116" cy="65" r="4.5" fill="#0F172A" />
      
      <!-- Polished Metallic Highlights -->
      <line x1="42" y1="54" x2="42" y2="76" stroke="#FEF08A" stroke-width="2.5" />
      <line x1="78" y1="57" x2="78" y2="73" stroke="#FEF08A" stroke-width="2.5" />
    </g>
  </g>
</svg>
